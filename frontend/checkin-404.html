<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-In Link Not Valid — Do Gym</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<style>
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#000000;color:#fff;margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:400px}
.mark{width:70px;height:70px;border-radius:20px;overflow:hidden;margin:0 auto 22px;box-shadow:0 10px 28px rgba(10,132,255,.35)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:26px;font-weight:900;margin:0 0 10px}
p{color:#8e8e93;line-height:1.6;font-size:15px}
</style>
</head>
<body>
<div class="box">
<div class="mark"><img src="/icon-512.png" alt=""></div>
<h1>This check-in link is not valid</h1>
<p>The QR poster you scanned may have been replaced with a new one. Please check in at the front desk, and the team will point you to the current poster.</p>
</div>
</body>
</html>
