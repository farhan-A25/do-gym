<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plans & Pricing — Do Gym</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--card:#101012;--card2:#17171b;--border:rgba(255,255,255,.07);
--grad:linear-gradient(135deg,#0a84ff 0%,#2ea8ff 52%,#0060df 100%);
--muted:#8e8e93;--muted2:#636366}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;background:#000000;color:#fff;min-height:100dvh}
.wrap{max-width:430px;margin:0 auto;padding:30px 18px 50px;background:linear-gradient(180deg,#0a0a0b,#000000);min-height:100dvh}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.brand img{width:40px;height:40px;border-radius:11px;box-shadow:0 8px 24px rgba(10,132,255,.35);display:block}
.brand>span{font-size:19px;font-weight:900;letter-spacing:-.02em}
a.back{color:#7cc7ff;text-decoration:none;font-weight:700;font-size:14px}
h1{font-size:29px;font-weight:900;letter-spacing:-.02em;margin-top:20px;line-height:1.15}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px;line-height:1.55;margin-top:8px}
.seg{display:flex;background:#101012;border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin:22px 0 18px}
.seg button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:800;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;min-height:46px}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 10px 28px rgba(10,132,255,.35)}
.save-note{text-align:center;font-size:12.5px;color:#7cc7ff;font-weight:700;margin:-8px 0 16px;min-height:16px}
.plan-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.45);position:relative}
.plan-card.popular{border-color:rgba(10,132,255,.55)}
.badge{position:absolute;top:-11px;right:16px;background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:5px 11px;border-radius:999px;text-transform:uppercase}
.plan-name{font-size:19px;font-weight:900}
.price{font-size:36px;font-weight:900;letter-spacing:-.02em;margin-top:8px}
.price span{font-size:14px;color:var(--muted);font-weight:600}
.feat{list-style:none;margin-top:14px}
.feat li{font-size:14px;color:#d7d7db;padding:6px 0 6px 26px;position:relative;line-height:1.45}
.feat li::before{content:"✓";position:absolute;left:2px;color:#2ea8ff;font-weight:900}
.cta{display:block;text-align:center;margin-top:16px;background:var(--grad);color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:12px;box-shadow:0 10px 28px rgba(10,132,255,.35)}
.smallprint{text-align:center;color:var(--muted2);font-size:12.5px;margin-top:20px;line-height:1.6}
.legal{display:flex;gap:18px;justify-content:center;margin-top:22px;font-size:13px}
.legal a{color:var(--muted);text-decoration:none;font-weight:600}
.loading{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/icon-192.png" alt="Do Gym"><span>Do <span class="grad-text">Gym</span></span></div>
  <a class="back" href="/">← Back to login</a>
  <h1>Simple pricing for <span class="grad-text">gym owners</span></h1>
  <p class="sub">Everything you need to stop members from quietly leaving — the No-Show Red List, QR check-ins and renewals, in one app.</p>

  <div class="seg" role="group" aria-label="Billing period">
    <button type="button" id="btn-monthly" class="on">Monthly</button>
    <button type="button" id="btn-yearly">Yearly</button>
  </div>
  <p class="save-note" id="save-note"></p>

  <div id="plans"><p class="loading">Loading plans…</p></div>

  <p class="smallprint">Prices in INR. GST extra as applicable. Cancel anytime.</p>
  <div class="legal">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Use</a>
  </div>
</div>

<script>
"use strict";
const inr = n => "₹" + Number(n).toLocaleString("en-IN");
let PLANS = [];
let PERIOD = "monthly";
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function render(){
  document.getElementById("btn-monthly").classList.toggle("on", PERIOD === "monthly");
  document.getElementById("btn-yearly").classList.toggle("on", PERIOD === "yearly");
  document.getElementById("save-note").textContent = PERIOD === "yearly" ? "Yearly billing = 2 months free 🎉" : "";
  document.getElementById("plans").innerHTML = PLANS.map(p => {
    const price = PERIOD === "monthly" ? p.monthly : p.yearly;
    const per = PERIOD === "monthly" ? "/month" : "/year";
    return '<div class="plan-card' + (p.badge ? " popular" : "") + '">' +
      (p.badge ? '<span class="badge">' + esc(p.badge) + "</span>" : "") +
      '<div class="plan-name">' + esc(p.name) + "</div>" +
      '<div class="price">' + inr(price) + "<span>" + per + "</span></div>" +
      '<ul class="feat">' + p.features.map(f => "<li>" + esc(f) + "</li>").join("") + "</ul>" +
      '<a class="cta" href="/">Start with ' + esc(p.name) + "</a></div>";
  }).join("");
}
document.getElementById("btn-monthly").addEventListener("click", () => { PERIOD = "monthly"; render(); });
document.getElementById("btn-yearly").addEventListener("click", () => { PERIOD = "yearly"; render(); });
fetch("/api/plans").then(r => r.json()).then(d => { PLANS = d.plans || []; render(); })
  .catch(() => { document.getElementById("plans").innerHTML = '<p class="loading">We could not load the plans just now. Please refresh the page.</p>'; });
</script>
</body>
</html>
