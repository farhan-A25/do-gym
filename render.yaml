# Render Blueprint — one-click deploy of the PowerHouse Gym Owner App.
# In Render: New + → Blueprint → connect this GitHub repo → Apply.
services:
  - type: web
    name: powerhouse-gym
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Render generates a strong random SECRET_KEY for you.
      - key: SECRET_KEY
        generateValue: true
      # Public site: hide the demo-login hint box on the login page.
      # (The demo account itself still works until you change it — see README "Going live".)
      - key: SHOW_DEMO_HINT
        value: "false"
      # PUBLIC SITE = REAL DATA ONLY (Farhan's order, 2026-11-07): no demo
      # owner, no demo members, no fake numbers anywhere. Demo seeding stays
      # available for local runs only by setting SEED_DEMO=true manually.
      - key: SEED_DEMO
        value: "false"
      # PERMANENT DATABASE (Farhan's fix, 2026-11-08): a free hosted
      # Postgres (Neon) connection string, set by Farhan in the Render
      # dashboard — sync: false keeps the password OUT of this repo.
      # While unset, the app falls back to the local SQLite file, which
      # Render's free tier wipes on every deploy/restart.
      - key: DATABASE_URL
        sync: false
      # Farhan's admin password for the /control page + admin API.
      # sync: false = Render asks YOU to type it at deploy; it is never
      # stored in this repo. While unset, /control does not exist.
      - key: ADMIN_SECRET
        sync: false
      # Email OTP delivery (signup step 2). Set all five at deploy with
      # a Gmail App Password (see README) or signups cannot receive
      # their OTP codes. sync: false = Render asks you; never in repo.
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # DEV_OTP_ECHO is deliberately NOT set here: OTP codes must only
      # ever travel by email in production.
